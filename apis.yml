aid: scape
name: Scape
description: >-
  Scape (Scape Wellness) is an on-demand wellness technology platform in Latin
  America that lets customers book professional spa experiences delivered to
  their home, apartment, hotel, Airbnb, office, or corporate event. Certified,
  identity-verified therapists arrive with all required equipment — professional
  massage table, towels, oils, and materials. The catalog spans relaxing, deep
  tissue, sports, prenatal, lymphatic drainage, reflexology, and couples
  massages; facials; body treatments; and combined facial-plus-massage
  experiences, alongside personal and corporate gift cards and workplace
  wellness programs. Scape operates in Mexico, Colombia, Chile, and the
  Dominican Republic via iOS and Android apps, with payments through MercadoPago
  and PayPal. It is a consumer booking platform and does not publish a public
  developer API or developer portal. Backed by 500 Global.
